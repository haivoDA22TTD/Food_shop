spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Disable Redis auto-configuration for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT Configuration for tests
jwt:
  secret: test-secret-key-for-testing-purposes-only-do-not-use-in-production
  expiration: 3600000

# OAuth2 Configuration (disabled for tests)
spring.security.oauth2.client:
  registration:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      scope:
        - email
        - profile

# Disable Eureka client for tests
eureka:
  client:
    enabled: false

# Disable actuator security for tests
management:
  endpoints:
    web:
      exposure:
        include: health
