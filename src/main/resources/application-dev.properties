server.port=${PORT:8080}

spring.application.name=identity-service

# Local MySQL (override via env in real deployment)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:foodshop_identity}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-please-change-in-production-must-be-long-enough-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 (optional for dev)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL:http://localhost:8080}/login/oauth2/code/google
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Eureka - disable for local dev
eureka.client.enabled=${EUREKA_ENABLED:false}

logging.level.com.example.foodshop=DEBUG
logging.level.org.springframework.security=INFO
